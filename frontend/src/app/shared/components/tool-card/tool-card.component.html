<mat-card
  class="tool-card"
  [class.tool-card--disabled]="!tool.available"
  appearance="outlined"
>
  <mat-card-header>
    <div mat-card-avatar class="tool-card__avatar">
      <mat-icon>{{ tool.icon }}</mat-icon>
    </div>
    <mat-card-title>{{ tool.name }}</mat-card-title>
    @if (!tool.available) {
      <span class="tool-card__badge">Bientôt disponible</span>
    }
  </mat-card-header>

  <mat-card-content>
    <p>{{ tool.description }}</p>
  </mat-card-content>

  <mat-card-actions align="end">
    @if (tool.available) {
      <a
        mat-stroked-button
        color="primary"
        class="tool-card__cta"
        [routerLink]="tool.route"
      >
        Ouvrir
        <mat-icon class="tool-card__cta-arrow">arrow_forward</mat-icon>
      </a>
    } @else {
      <button mat-button disabled>Bientôt</button>
    }
  </mat-card-actions>
</mat-card>
